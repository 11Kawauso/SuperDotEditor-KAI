<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スーパードットエディター・改</title>
<link rel="icon" href="images/pixel-art_icon.png" type="image/png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --text: #1a1a18;
    --text-muted: #888884;
    --border: #e5e5e3;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 72px;
  }

  a { color: inherit; }

  /* 真ん中：小さな画面と「ドット絵を描く」（まとめてエディタへのリンク） */
  .start {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    text-decoration: none;
  }
  .screen {
    display: block;
    width: 160px;
    height: 160px;
    image-rendering: pixelated;
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .start:hover .screen,
  .start:focus-visible .screen {
    transform: translateY(-3px);
    box-shadow: 0 6px 22px rgba(0,0,0,0.12);
  }
  .start-label {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.08em;
    padding-bottom: 2px;
    border-bottom: 1px solid transparent;
  }
  .start:hover .start-label { border-bottom-color: currentColor; }

  .legal-links {
    margin-top: 40px;
    display: flex;
    gap: 16px;
    font-size: 12px;
  }
  .legal-links a { color: var(--text-muted); text-decoration: none; }
  .legal-links a:hover { color: var(--text); text-decoration: underline; }

  /* 広告（忍者AdMax 300x250）。読み込み前後でレイアウトがずれないよう、枠の大きさを先に確保する */
  .ad {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .ad-label { font-size: 10px; color: var(--text-muted); letter-spacing: 0.1em; }
  .ad-slot {
    width: 300px;
    height: 250px;
    overflow: hidden;
  }

  /* 画面の左下・右下の端 */
  .corner {
    position: fixed;
    bottom: 16px;
    display: flex;
    align-items: center;
    text-decoration: none;
  }
  .credit {
    left: 16px;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .credit:hover { color: var(--text); }
  .credit svg { width: 12px; height: 12px; fill: currentColor; }

  /* PEPORIS（テトリス風のゲーム）のブロック。押すと直接PEPORISへ */
  .tetris-link { right: 16px; padding: 4px; }
  .tetris-link svg { display: block; width: 40px; height: auto; }
  .tetris-link:hover svg,
  .tetris-link:focus-visible svg { animation: wiggle 0.5s steps(2, end) infinite; }
  @keyframes wiggle {
    0%   { transform: rotate(0deg); }
    50%  { transform: rotate(-8deg); }
    100% { transform: rotate(8deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .screen { transition: none; }
    .tetris-link:hover svg, .tetris-link:focus-visible svg { animation: none; }
  }
</style>
</head>
<body>

      <rect x="0" y="0" width="10" height="10"/><rect x="11" y="0" width="10" height="10"/>
      <rect x="22" y="0" width="10" height="10"/><rect x="11" y="11" width="10" height="10"/>
    </g>

</a>

<script>
// 小さな画面に、ドット絵が1マスずつ描かれていく様子を繰り返し表示する
(() => {
  const ART = [
    '..XXX...XXX..',
    '.XRRRX.XRRRX.',
    'XRWWRRXRRRRRX',
    'XRWRRRRRRRRRX',
    'XRRRRRRRRRRRX',
    '.XRRRRRRRRDX.',
    '..XRRRRRRDX..',
    '...XRRRRDX...',
    '....XRRDX....',
    '.....XDX.....',
    '......X......',
  ];
  const COLORS = { X: '#3a2a2a', R: '#e74c3c', D: '#c0392b', W: '#ffffff' };
  const SIZE = 16;
  const OX = 1, OY = 2; // 16×16の画面の中央に置く

  const ctx = document.getElementById('screen').getContext('2d');
  const pixels = [];
  ART.forEach((line, y) => [...line].forEach((ch, x) => {
    if (COLORS[ch]) pixels.push({ x: x + OX, y: y + OY, color: COLORS[ch] });
  }));

  // エディタと同じ市松模様の背景
  function clearScreen() {
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        ctx.fillStyle = (x + y) % 2 ? '#eeeeee' : '#dddddd';
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }
  function put(p) {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 1, 1);
  }

  clearScreen();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    pixels.forEach(put);
    return;
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  (async function loop() {
    for (;;) {
      clearScreen();
      await sleep(500);
      const order = [...pixels];
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      for (const p of order) { put(p); await sleep(18); }
      await sleep(2600);
    }
  })();
})();
</script>
</body>
</html>
